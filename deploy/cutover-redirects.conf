# Legacy -> Next.js URL redirect map (cutover gate #33), built 2026-07-31
# from the ACTUAL legacy React Router inventory (decompiled App.js, 46 routes).
#
# Include inside the production vhost AFTER `RewriteEngine On` and BEFORE the
# reverse-proxy rules. Everything here is 301 (permanent) so Google transfers
# ranking to the new URLs.
#
# Routes NOT listed keep identical paths on the new site (verified 1:1):
#   / /about-us /blog/:slug /car/:id /car-sourcing /contact /faq
#   /forgot-password /privacy-policy /reset-password /sign-in /sign-up
#   /staff-login /terms-and-conditions /thankyou /my-account/* /dashboard
#   /leads /members /deposits

RewriteEngine On

# --- renamed public pages ---
RewriteRule ^/?blogs/?$            /blog                 [R=301,L]
RewriteRule ^/?faqs/?$             /faq                  [R=301,L]
RewriteRule ^/?registration/?$     /sign-up              [R=301,L]

# --- old car-detail aliases (both indexed historically) ---
RewriteRule ^/?single-vehicle/([^/]+)/?$  /car/$1        [R=301,L]
RewriteRule ^/?vehicle/([^/]+)/?$         /car/$1        [R=301,L]

# --- legacy used-cars path filters (/used-cars/:location?/:brand?/:model?)
# The new site filters by query string. Location has no new equivalent and is
# dropped; brand/model carry across (imperfect slug->Make casing just shows
# an unfiltered list — never an error page). used-cars2 was an A/B relic.
RewriteRule ^/?used-cars2(/.*)?$                        /used-cars            [R=301,L]
RewriteRule ^/?used-cars/[^/]+/([^/]+)/([^/]+)/?$  "/used-cars?Make=$1&Model=$2" [R=301,L,NE]
RewriteRule ^/?used-cars/[^/]+/([^/]+)/?$          "/used-cars?Make=$1"          [R=301,L,NE]
RewriteRule ^/?used-cars/[^/]+/?$                   /used-cars                   [R=301,L]

# --- retired flows ---
# Bank-transfer instructions page: deposits are now Stripe checkout.
RewriteRule ^/?bank-details/?$     /how-it-works         [R=301,L]
# Car-sourcing payment step lives inside /car-sourcing now.
RewriteRule ^/?payment/?$          /car-sourcing         [R=301,L]
# Dealer signup: retired product decision — quiet redirect home.
RewriteRule ^/?dealer-signup/?$    /                     [R=301,L]

# --- legacy admin long tail (no SEO value; land staff on the new admin) ---
RewriteRule ^/?vehicle-lists(-new)?/?$        /cars       [R=301,L]
RewriteRule ^/?members/([^/]+)/?$             /members    [R=301,L]
RewriteRule ^/?(add-blog|edit-blog/.*|add-faq|edit-faq/.*|edit-page/.*|pages|promotions|queries|settings|view-log|vrt-transactions|carsourcing-transactions|dealer-transactions)/?$ /dashboard [R=301,L]
